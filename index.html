<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireLight</title>
<link rel="stylesheet" href="app.css?v=21">
</head>
<body>
<div class="page-frame">
<div id="scroll-progress" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#/">
      <span class="logo-hex"></span> HireLight <span class="logo-cn">招人快筛</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="landing" data-i18n="nav.how">Как это работает</a>
      <a href="#/jobs" data-nav="jobs" data-i18n="nav.jobs" hidden></a>
      <a href="#/emp" data-nav="emp" hidden><span data-i18n="nav.dash"></span><span class="nav-badge" id="nav-badge" hidden></span></a>
      <a href="#/me" data-nav="me" data-i18n="nav.cab" hidden></a>
      <a href="#/heat" data-nav="heat" data-i18n="heat.nav" hidden></a>
      <div class="lang-switch" id="lang-switch">
        <button type="button" data-lang="ru">Рус</button>
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">Eng</button>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-logout" data-i18n="nav.logout" hidden></button>
      <a href="#/login" class="btn btn-ghost btn-sm" id="nav-login" data-i18n="auth.login" hidden></a>
      <a href="#/create" class="btn btn-primary btn-sm" id="nav-create" data-i18n="nav.create" hidden></a>
    </nav>
  </div>
</header>

<main id="main">

  <!-- ЛЕНДИНГ -->
  <section class="view" id="view-landing">
    <div class="hero-grid">
      <div class="hero-big">
        <div class="giant" id="giant-word" data-i18n="land.big"></div>
        <div class="giant-orb" id="hero-orb" aria-hidden="true"></div>
        <div class="giant-orb orb2" aria-hidden="true"></div>
        <div class="chip-float cf1" data-i18n="land.cf1"></div>
        <div class="chip-float cf2" data-i18n="land.cf2"></div>
        <div class="chip-float cf3" data-i18n="land.cf3"></div>
      </div>
      <div class="hero-side">
        <div class="kicker" data-i18n="land.kicker"></div>
        <h1 data-i18n-html="land.h1">Отклики разбираются сами.<br>Вы выбираете людей.</h1>
        <p class="lead" data-i18n="land.lead"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#/register/employer" data-i18n="land.roleEmp"></a>
          <a class="btn btn-ghost" href="#/jobs" data-i18n="land.roleSeek"></a>
        </div>
        <div class="orbit-wrap" aria-hidden="true">
          <svg class="orbit" viewBox="0 0 120 120">
            <defs><path id="orbitPath" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></defs>
            <text><textpath href="#orbitPath" id="orbit-text"></textpath></text>
            <circle cx="60" cy="60" r="7" fill="#33B5FF"/>
          </svg>
        </div>
      </div>
      <div class="hero-card" id="hero-digest">
        <div class="digest-title" data-i18n="land.digestTitle"></div>
        <div class="digest-item">
          <span class="badge badge-green" data-i18n="level.green"></span>
          <b>Анна Соколова</b>
          <span class="muted" data-i18n="land.digest1sub"></span>
        </div>
        <div class="digest-item">
          <span class="badge badge-amber" data-i18n="level.amber"></span>
          <b>Марина Ким</b>
          <span class="muted" data-i18n="land.digest2sub"></span>
        </div>
        <div class="digest-item">
          <span class="badge badge-red" data-i18n="level.red"></span>
          <b>Дмитрий Волков</b>
          <span class="muted" data-i18n="land.digest3sub"></span>
        </div>
        <div class="digest-foot muted" data-i18n="land.digestFoot"></div>
      </div>
    </div>

    <h2 class="section-title" data-i18n="role.choose"></h2>
    <div class="roles reveal">
      <a class="role-card" href="#/register/employer">
        <div class="role-ic">🏢</div>
        <b data-i18n="role.empT"></b>
        <p data-i18n="role.empD"></p>
        <span class="role-go" data-i18n="land.cta1"></span>
      </a>
      <a class="role-card alt" href="#/jobs">
        <div class="role-ic">🧑‍💻</div>
        <b data-i18n="role.seekT"></b>
        <p data-i18n="role.seekD"></p>
        <span class="role-go" data-i18n="land.roleSeek"></span>
      </a>
    </div>

    <div class="pains reveal">
      <div class="pain"><b data-i18n="land.pain1b"></b><span data-i18n="land.pain1"></span></div>
      <div class="pain"><b data-i18n="land.pain2b"></b><span data-i18n="land.pain2"></span></div>
      <div class="pain"><b data-i18n="land.pain3b"></b><span data-i18n="land.pain3"></span></div>
    </div>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track">
        <span data-i18n="land.marquee"></span><span data-i18n="land.marquee"></span><span data-i18n="land.marquee"></span>
      </div>
    </div>

    <h2 class="section-title reveal" data-i18n="land.howTitle"></h2>
    <div class="steps reveal">
      <div class="step"><div class="step-num">1</div><b data-i18n="land.step1t"></b>
        <p data-i18n="land.step1d"></p></div>
      <div class="step"><div class="step-num">2</div><b data-i18n="land.step2t"></b>
        <p data-i18n="land.step2d"></p></div>
      <div class="step"><div class="step-num">3</div><b data-i18n="land.step3t"></b>
        <p data-i18n="land.step3d"></p></div>
    </div>

    <div class="rules-band reveal">
      <div>
        <h2 data-i18n="land.rulesTitle"></h2>
        <p class="muted" data-i18n="land.rulesText"></p>
      </div>
      <div class="rule-chips">
        <span class="chip" data-i18n="land.chip1"></span>
        <span class="chip" data-i18n="land.chip2"></span>
        <span class="chip" data-i18n="land.chip3"></span>
        <span class="chip" data-i18n="land.chip4"></span>
      </div>
    </div>

    <div class="cta-band reveal">
      <div class="cta-cell">
        <div>
          <h2 data-i18n="land.ctaTitle"></h2>
          <a class="btn btn-primary btn-lg" href="#/create" data-i18n="land.cta1"></a>
        </div>
        <a class="cta-arrow" href="#/create" aria-label="→ create">↗</a>
      </div>
    </div>
  </section>

  <!-- СОЗДАНИЕ ВАКАНСИИ -->
  <section class="view narrow" id="view-create">
    <h1 data-i18n="create.h1"></h1>
    <p class="muted" data-i18n="create.lead"></p>
    <form id="create-form" class="card form" novalidate>
      <label><span data-i18n="create.title"></span>
        <input type="text" name="title" required data-i18n-ph="ph.create.title">
      </label>
      <div class="form-row">
        <label><span data-i18n="create.company"></span>
          <input type="text" name="company" data-i18n-ph="ph.create.company">
        </label>
        <label><span data-i18n="create.district"></span>
          <input type="text" name="district" required data-i18n-ph="ph.create.district">
        </label>
      </div>
      <div class="form-row">
        <label><span data-i18n="create.salary"></span>
          <input type="number" name="salaryFrom" min="0" step="1000" placeholder="60000">
        </label>
        <label><span data-i18n="create.cur"></span>
          <select name="cur">
            <option value="RUB" data-i18n="cur.RUB" selected></option>
            <option value="USD" data-i18n="cur.USD"></option>
            <option value="EUR" data-i18n="cur.EUR"></option>
            <option value="CNY" data-i18n="cur.CNY"></option>
          </select>
        </label>
        <label><span data-i18n="create.schedule"></span>
          <input type="text" name="schedule" data-i18n-ph="ph.create.schedule">
        </label>
      </div>
      <label><span data-i18n="create.desc"></span>
        <textarea name="description" rows="3" data-i18n-ph="ph.create.desc"></textarea>
      </label>
      <label><span data-i18n="create.lang"></span>
        <select name="reqLang">
          <option value="any" data-i18n="langOpt.any" selected></option>
          <option value="ru" data-i18n="langOpt.ru"></option>
          <option value="zh" data-i18n="langOpt.zh"></option>
          <option value="en" data-i18n="langOpt.en"></option>
        </select>
      </label>
      <label><span data-i18n="create.rules"></span>
        <textarea name="rules" rows="5" required data-i18n-ph="ph.create.rules"></textarea>
        <span class="hint" data-i18n="create.hint"></span>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="create.submit"></button>
        <a class="btn btn-ghost" href="#/dashboard" data-i18n="create.cancel"></a>
      </div>
    </form>
  </section>

  <!-- ВАКАНСИЯ ОПУБЛИКОВАНА -->
  <section class="view narrow" id="view-created">
    <div class="success-mark">✓</div>
    <h1 data-i18n="created.h1"></h1>
    <p class="muted" data-i18n="created.lead"></p>
    <div class="card share-card">
      <div id="qr-box" class="qr-box"></div>
      <div class="share-info">
        <div class="share-link" id="share-link"></div>
        <div class="share-actions">
          <a class="btn btn-primary" id="btn-open-vacancy" href="#" data-i18n="created.open"></a>
          <a class="btn btn-ghost" href="#/dashboard" data-i18n="created.toDash"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- СТРАНИЦА ВАКАНСИИ (для кандидатов) -->
  <section class="view narrow" id="view-apply">
    <div id="apply-vacancy"></div>
    <form id="apply-form" class="card form" novalidate>
      <h2 data-i18n="apply.h2"></h2>
      <div class="form-row">
        <label><span data-i18n="apply.name"></span>
          <input type="text" name="name" required data-i18n-ph="ph.apply.name">
        </label>
        <label><span data-i18n="apply.phone"></span>
          <input type="tel" name="phone" required data-i18n-ph="ph.apply.phone">
        </label>
      </div>
      <div class="form-row">
        <label><span data-i18n="apply.years"></span>
          <input type="number" name="years" min="0" max="60" step="1" placeholder="3">
        </label>
        <label><span data-i18n="apply.salary"></span>
          <input type="number" name="salary" min="0" step="1000" placeholder="65000">
        </label>
        <label><span data-i18n="apply.salCur"></span>
          <select name="salCur">
            <option value="RUB" data-i18n="cur.RUB" selected></option>
            <option value="USD" data-i18n="cur.USD"></option>
            <option value="EUR" data-i18n="cur.EUR"></option>
            <option value="CNY" data-i18n="cur.CNY"></option>
          </select>
        </label>
      </div>
      <label><span data-i18n="apply.district"></span>
        <input type="text" name="district" data-i18n-ph="ph.apply.district">
      </label>
      <label><span data-i18n="apply.about"></span>
        <textarea name="about" rows="4" required data-i18n-ph="ph.apply.about"></textarea>
      </label>
      <div class="voice-card" id="voice-card">
        <div class="voice-head">
          <span class="voice-ico">🎙</span>
          <div>
            <b data-i18n="voice.cardTitle"></b>
            <p data-i18n="voice.cardText"></p>
          </div>
        </div>
        <div id="voice-status" class="voice-status" hidden></div>
        <button type="button" id="voice-start" class="btn btn-ghost btn-sm">🎙 <span data-i18n="voice.cardBtn"></span></button>
      </div>
      <div class="field">
        <span class="lbl" data-i18n="apply.myLang"></span>
        <div class="lang-checks" id="lang-checks">
          <label class="check"><input type="checkbox" name="langs" value="ru"><span data-i18n="langOpt.ru"></span></label>
          <label class="check"><input type="checkbox" name="langs" value="zh"><span data-i18n="langOpt.zh"></span></label>
          <label class="check"><input type="checkbox" name="langs" value="en"><span data-i18n="langOpt.en"></span></label>
        </div>
        <div class="field-err" id="lang-err" hidden data-i18n="apply.langErr"></div>
      </div>
      <label><span data-i18n="apply.resume"></span>
        <input type="file" name="resume" accept="image/*">
        <img id="resume-thumb" class="resume-thumb" alt="" hidden>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="apply.submit"></button>
      </div>
    </form>
  </section>

  <!-- ОТКЛИК ОТПРАВЛЕН -->
  <section class="view narrow" id="view-applied">
    <div class="success-mark">✓</div>
    <h1 id="applied-title"></h1>
    <p class="muted" id="applied-text"></p>
    <div class="card applied-card">
      <div class="digest-title" data-i18n="applied.whatsNext"></div>
      <p class="muted" data-i18n="applied.nextText"></p>
    </div>
    <a class="btn btn-ghost" href="#/" data-i18n="applied.home"></a>
  </section>

  <!-- КАБИНЕТ -->
  <section class="view" id="view-dashboard">
    <div class="dash-head">
      <h1 data-i18n="dash.h1"></h1>
      <button class="btn btn-ghost btn-sm" id="btn-reset" data-i18n="dash.reset"></button>
    </div>
    <div id="vacancy-list" class="vacancy-list"></div>
    <div id="vacancy-detail"></div>
  </section>

  <!-- ВХОД / РЕГИСТРАЦИЯ -->
  <section class="view narrow" id="view-auth">
    <h1 id="auth-title"></h1>
    <p class="muted" id="auth-sub"></p>
    <form id="auth-form" class="card form" novalidate>
      <label id="auth-name-lbl"><span data-i18n="auth.name"></span>
        <input type="text" name="name" autocomplete="name">
        <div class="field-err" data-err="name" hidden></div>
      </label>
      <label><span data-i18n="auth.email"></span>
        <input type="email" name="email" required autocomplete="email" placeholder="you@mail.com">
        <div class="field-err" data-err="email" hidden></div>
      </label>
      <label><span data-i18n="auth.pass"></span>
        <input type="password" name="password" required minlength="6" autocomplete="current-password">
        <div class="field-err" data-err="password" hidden></div>
      </label>
      <div class="field-err" id="auth-err" hidden></div>
      <div id="auth-ok" class="lang-note" hidden></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="auth-submit"></button>
        <a class="btn btn-ghost" id="auth-switch" href="#/login"></a>
      </div>
      <a href="#/recover" id="auth-forgot" class="forgot-link" hidden data-i18n="auth.forgot"></a>
    </form>
  </section>

  <!-- ЛЕНТА ВАКАНСИЙ -->
  <section class="view" id="view-jobs">
    <div class="dash-head"><h1 data-i18n="jobs.title"></h1></div>
    <div id="jobs-list" class="jobs-list"></div>
  </section>

  <!-- СТРАНИЦА ВАКАНСИИ -->
  <section class="view narrow" id="view-job">
    <div id="job-body"></div>
    <div id="job-cta"></div>
  </section>


  <!-- ОТКЛИК ОТПРАВЛЕН -->
  <section class="view narrow" id="view-applied">
    <div class="success-mark" id="applied-mark">✓</div>
    <h1 id="applied-title"></h1>
    <p class="muted" id="applied-text"></p>
    <div class="card applied-card">
      <div class="digest-title" data-i18n="applied.whatsNext"></div>
      <p class="muted" data-i18n="applied.nextText"></p>
    </div>
    <div class="form-actions">
      <a class="btn btn-primary" href="#/me" data-i18n="nav.cab"></a>
      <a class="btn btn-ghost" href="#/jobs" data-i18n="nav.jobs"></a>
    </div>
  </section>

  <!-- ВОССТАНОВЛЕНИЕ ПАРОЛЯ -->
  <section class="view narrow" id="view-recover">
    <h1 data-i18n="rec.title"></h1>
    <p class="muted" data-i18n="rec.sub"></p>
    <form id="recover-form" class="card form" novalidate>
      <label><span data-i18n="auth.email"></span>
        <input type="email" name="email" required>
      </label>
      <label><span data-i18n="rec.code"></span>
        <input type="text" name="code" required>
      </label>
      <label><span data-i18n="rec.newPass"></span>
        <input type="password" name="password" required minlength="6">
      </label>
      <div class="field-err" id="rec-err" hidden></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="rec.btn"></button>
        <a class="btn btn-ghost" href="#/login" data-i18n="rec.back"></a>
      </div>
    </form>
  </section>

  <!-- КАБИНЕТ РАБОТОДАТЕЛЯ -->
  <section class="view" id="view-emp">
    <div class="dash-head">
      <h1 data-i18n="emp.title"></h1>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-logout2" data-i18n="nav.logout"></button>
    </div>
    <div class="emp-grid">
      <div class="card">
        <div class="digest-title" data-i18n="emp.company"></div>
        <form id="company-form" class="form">
          <label><span data-i18n="emp.cname"></span>
            <input type="text" name="name" required>
          </label>
          <label><span data-i18n="emp.ccity"></span>
            <input type="text" name="city">
          </label>
          <label><span data-i18n="emp.cdesc"></span>
            <textarea name="desc" rows="3"></textarea>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-sm" data-i18n="emp.save"></button>
          </div>
        </form>
      </div>
      <div class="card" id="ai-card">
        <div class="digest-title" data-i18n="emp.ai"></div>
        <p class="muted" id="ai-status" style="font-size:13.5px"></p>
        <p class="muted" id="ai-pending" style="font-size:13.5px"></p>
        <div class="form-actions">
          <button type="button" class="btn btn-primary btn-sm" id="btn-ai-run" data-i18n="emp.aiRun"></button>
        </div>
        <div class="ai-chat" id="ai-chat" hidden></div>
      </div>
    </div>
    <div class="dash-head" style="margin-top:30px">
      <h2 style="margin:0;font-size:22px" data-i18n="emp.vacs"></h2>
      <a class="btn btn-primary btn-sm" href="#/create" data-i18n="emp.new"></a>
    </div>
    <div id="emp-vacs" class="vacancy-list"></div>
    <p class="muted" id="emp-none" data-i18n="emp.none" hidden></p>
  </section>

  <!-- ВАКАНСИЯ РАБОТОДАТЕЛЯ: ОТКЛИКИ -->
  <section class="view" id="view-empvac">
    <div id="empvac-head" class="detail-head"></div>
    <div id="empvac-body"></div>
  </section>

  <!-- КАБИНЕТ СОИСКАТЕЛЯ -->
  <section class="view" id="view-me">
    <div class="dash-head">
      <h1 data-i18n="me.title"></h1>
      <a class="btn btn-primary btn-sm" href="#/jobs" data-i18n="me.toJobs"></a>
    </div>
    <div id="me-list"></div>
  </section>

</main>

  <!-- ТЕПЛОВАЯ КАРТА -->
  <section class="view" id="view-heat">
    <div class="dash-head">
      <h1 data-i18n="heat.title"></h1>
    </div>
    <div class="card" style="margin-bottom:14px">
      <label style="display:block;font-size:13px;font-weight:700">
        <span data-i18n="heat.path"></span>
        <select id="heat-path" style="display:block;width:100%;max-width:460px;margin-top:7px;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:12px;background:#fff"></select>
      </label>
      <div class="cards" id="heat-stats" style="margin:14px 0 0"></div>
      <p class="muted" id="heat-hint" style="font-size:12.5px;margin:10px 0 0" data-i18n="heat.hint"></p>
    </div>
    <div class="heat-wrap" id="heat-wrap">
      <iframe id="heat-frame" title="HireLight page"></iframe>
      <canvas id="heat-canvas"></canvas>
    </div>
  </section>

</main>

</main>

<footer class="footer" data-i18n="footer.text"></footer>
</div>

<script src="qrcode.js"></script>
<script src="i18n.js?v=21"></script>
<script src="config.js?v=21"></script>
<script src="app.js?v=21"></script>
</body>
</html>
